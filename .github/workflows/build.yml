# SPDX-License-Identifier: Apache-2.0
name: Build and boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-14]
        accel: [zephyr, tcg]
        cpu: [cortex-a53, cortex-a57, cortex-a72]
    env:
      ACCEL: ${{ matrix.accel }}
      CPU: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: make host-deps
      - uses: actions/cache@v4
        with:
          path: |
            .tools/zephyr-sdk-1.0.1
            downloads
            ~/.cache/pip
            ~/Library/Caches/pip
          key: qoz-${{ runner.os }}-${{ runner.arch }}-sdk-1.0.1-${{ hashFiles('requirements*.txt', 'tests/requirements.txt') }}
      - name: Set up workspace and SDK
        run: make setup
      - name: Check configuration and Linux boot
        run: |
          make doctor test-tools
          make check
      - name: Run component regressions
        if: matrix.accel == 'zephyr' && matrix.cpu == 'cortex-a53'
        run: make probe test-payload test-glib test-arch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.accel }}-${{ matrix.cpu }}
          path: |
            build/*.log
            build/twister/*.xml
            build/twister/*.json
