# SPDX-License-Identifier: Apache-2.0
name: Build and boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Alpine Linux desktop
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      JOBS: 4
      QEMU_SYSTEM_AARCH64: /usr/bin/qemu-system-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install host and desktop validation dependencies
        run: |
          make host-deps
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm ipxe-qemu seabios fonts-dejavu-core
          docker info
      - uses: actions/cache@v4
        with:
          path: |
            .tools/zephyr-sdk-1.0.1
            downloads
            ~/.cache/pip
          key: qoz-${{ runner.os }}-${{ runner.arch }}-sdk-1.0.1-${{ hashFiles('requirements*.txt', 'tests/requirements.txt') }}
      - name: Set up workspace and SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make setup
          .venv/bin/python -m pip install -r requirements-demo.txt
      - name: Boot Alpine Linux and verify desktop interaction
        run: make check-desktop
      - name: Upload desktop validation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-desktop-validation
          path: |
            build/desktop-validation/
            build/demo-recordings/system-desktop.log
            build/demo-recordings/system-desktop.cast
            build/demo-recordings/system-desktop.png
            build/demo-recordings/system-desktop.json
            build/demo-recordings/desktop-frame.ppm
            build/desktop-files/packages.txt
            build/desktop-files/kernel.config
            build/desktop-files/provenance.json

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-14]
        accel: [zephyr, tcg]
        cpu: [cortex-a53, cortex-a57, cortex-a72]
    env:
      QEMU_ARGS: -M zephyr-virt -accel ${{ matrix.accel }} -cpu ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: make host-deps
      - uses: actions/cache@v4
        with:
          path: |
            .tools/zephyr-sdk-1.0.1
            downloads
            ~/.cache/pip
            ~/Library/Caches/pip
          key: qoz-${{ runner.os }}-${{ runner.arch }}-sdk-1.0.1-${{ hashFiles('requirements*.txt', 'tests/requirements.txt') }}
      - name: Set up workspace and SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make setup
      - name: Check configuration and Linux boot
        run: |
          make doctor test-tools
          make check
      - name: Run component regressions
        if: matrix.accel == 'zephyr' && matrix.cpu == 'cortex-a53'
        run: make probe test-payload test-glib test-arch
      - name: Load ELF and raw firmware from the Zephyr filesystem
        if: matrix.cpu == 'cortex-a53'
        run: make check-firmware
      - name: Verify manual startup and Linux process emulation
        if: matrix.accel == 'tcg'
        run: |
          make check QEMU_SHELL=1
          make check-user QEMU_ARGS="-cpu ${{ matrix.cpu }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.accel }}-${{ matrix.cpu }}
          path: |
            build/*.log
            build/user-*/user-validation.log
            build/twister/*.xml
            build/twister/*.json
