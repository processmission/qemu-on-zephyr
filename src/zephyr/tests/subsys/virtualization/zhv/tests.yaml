tests:
  subsys.virtualization.zhv:
    tags:
      - arm64
      - virtualization
    platform_allow:
      - qemu_cortex_a53
    integration_platforms:
      - qemu_cortex_a53
    timeout: 120
  subsys.virtualization.zhv.wide_ipa:
    tags:
      - arm64
      - virtualization
    platform_allow:
      - qemu_cortex_a53
    integration_platforms:
      - qemu_cortex_a53
    extra_configs:
      - CONFIG_ARM64_HYPERVISOR_IPA_BITS=36
    timeout: 120
